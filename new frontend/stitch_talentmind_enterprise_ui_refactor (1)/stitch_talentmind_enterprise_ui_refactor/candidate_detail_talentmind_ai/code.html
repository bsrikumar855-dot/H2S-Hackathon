<script src="/api.js"></script>
<script>
        function populateCandidateDrawer() {
            const cand = getSelectedCandidate();
            if (!cand) return;
            
            const container = document.getElementById('drawer-content-container');
            
            const skillsHTML = cand.skills.map(s => 
                `<span class="px-sm py-xs bg-surface-container-high rounded-full text-label-md font-label-md">${s}</span>`
            ).join('');
            
            const competenciesHTML = Object.entries(cand.competencies).map(([name, val]) => `
                <div class="space-y-xs">
                    <div class="flex justify-between text-label-md">
                        <span>${name}</span>
                        <span class="font-bold">${val}%</span>
                    </div>
                    <div class="h-2 bg-surface-container-high rounded-full overflow-hidden">
                        <div class="progress-bar-fill h-full bg-primary" style="width: 0%" data-progress="${val}"></div>
                    </div>
                </div>
            `).join('');
            
            const strengthsHTML = cand.strengths.map(str => `
                <li class="flex gap-sm items-start text-body-sm text-on-surface">
                    <span class="material-symbols-outlined text-[18px] text-tertiary mt-0.5">check_circle</span>
                    <span>${str}</span>
                </li>
            `).join('');
            
            const risksHTML = cand.risks.map(risk => `
                <li class="flex gap-sm items-start text-body-sm text-on-surface">
                    <span class="material-symbols-outlined text-[18px] text-error mt-0.5">info</span>
                    <span>${risk}</span>
                </li>
            `).join('');
            
            const historyHTML = cand.history.map((job, idx) => `
                <div class="relative">
                    <div class="absolute -left-[41px] top-0 w-4 h-4 rounded-full ${idx === 0 ? 'bg-primary' : 'bg-outline-variant'} border-4 border-white"></div>
                    <div>
                        <div class="flex justify-between items-start mb-xs">
                            <h6 class="font-bold text-body-md">${job.role}</h6>
                            <span class="text-label-sm text-on-surface-variant">${job.duration}</span>
                        </div>
                        <p class="text-label-md text-primary mb-sm">${job.company}</p>
                        <p class="text-body-sm text-on-surface-variant">${job.desc}</p>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = `
                <div class="bg-white rounded-xl border border-outline-variant p-lg flex flex-col md:flex-row gap-xl mb-xl">
                    <div class="relative">
                        <div class="w-24 h-24 rounded-2xl overflow-hidden shadow-sm">
                            <img class="w-full h-full object-cover" src="${cand.avatar}" alt="${cand.name} avatar"/>
                        </div>
                        <div class="absolute -bottom-2 -right-2 bg-primary-container text-on-primary-container p-xs rounded-lg border-2 border-white flex items-center gap-xs">
                            <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                            <span class="text-label-sm font-label-sm">Expert</span>
                        </div>
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-start mb-sm">
                            <div>
                                <h4 class="text-headline-md font-headline-md">${cand.name}</h4>
                                <p class="text-body-md text-on-surface-variant">${cand.title} • ${cand.experience}</p>
                            </div>
                            <div class="flex flex-col items-end">
                                <div class="text-primary font-headline-lg">${cand.score}%</div>
                                <div class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider">Match Score</div>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-xs">
                            <span class="px-sm py-xs bg-surface-container-high rounded-full text-label-md font-label-md">${cand.location}</span>
                            <span class="px-sm py-xs bg-surface-container-high rounded-full text-label-md font-label-md">${cand.salary}</span>
                            <span class="px-sm py-xs bg-surface-container-high rounded-full text-label-md font-label-md">Available: ${cand.availability}</span>
                        </div>
                    </div>
                </div>
                <section class="mb-xl">
                    <h5 class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest mb-md">Professional Summary</h5>
                    <p class="text-body-lg font-body-lg text-on-surface leading-relaxed">
                        ${cand.summary}
                    </p>
                </section>
                <section class="mb-xl">
                    <h5 class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest mb-md">Competency Analysis</h5>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-xl gap-y-md">
                        ${competenciesHTML}
                    </div>
                </section>
                <section class="mb-xl">
                    <h5 class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest mb-md">AI-Driven Insights</h5>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
                        <div class="p-lg rounded-xl bg-tertiary/5 border border-tertiary-container/20">
                            <div class="flex items-center gap-sm text-tertiary mb-sm">
                                <span class="material-symbols-outlined">trending_up</span>
                                <span class="font-bold">Core Strengths</span>
                            </div>
                            <ul class="space-y-sm">
                                ${strengthsHTML}
                            </ul>
                        </div>
                        <div class="p-lg rounded-xl bg-error/5 border border-error-container/20">
                            <div class="flex items-center gap-sm text-error mb-sm">
                                <span class="material-symbols-outlined">analytics</span>
                                <span class="font-bold">Growth Areas</span>
                            </div>
                            <ul class="space-y-sm">
                                ${risksHTML}
                            </ul>
                        </div>
                    </div>
                </section>
                <section class="mb-xl">
                    <h5 class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest mb-md">Experience Timeline</h5>
                    <div class="relative pl-8 border-l-2 border-outline-variant space-y-xl ml-4">
                        ${historyHTML}
                    </div>
                </section>
            `;
        }

        function openDrawer() {
            populateCandidateDrawer();
            const drawer = document.getElementById('candidateDrawer');
            drawer.classList.remove('pointer-events-none');
            drawer.classList.add('drawer-open');
            document.body.classList.add('overflow-hidden');
 
             // Trigger animations for progress bars
             setTimeout(() => {
                 document.querySelectorAll('.progress-bar-fill').forEach(bar => {
                     const targetWidth = bar.getAttribute('data-progress');
                     bar.style.width = targetWidth + '%';
                 });
             }, 400);
         }

        function closeDrawer() {
            const drawer = document.getElementById('candidateDrawer');
            drawer.classList.remove('drawer-open');
            document.body.classList.remove('overflow-hidden');
            
            // Reset progress bars for next time
            setTimeout(() => {
                drawer.classList.add('pointer-events-none');
                document.querySelectorAll('.progress-bar-fill').forEach(bar => {
                    bar.style.width = '0%';
                });
            }, 400);
        }

        // Initialize state (closed)
        window.addEventListener('DOMContentLoaded', () => {
            // Optional: Automatically open on load to showcase
            setTimeout(openDrawer, 800);

            // Hook up drawer actions
            document.getElementById('downloadCvBtn').addEventListener('click', () => {
                const cand = getSelectedCandidate();
                if (!cand) return;
                
                const cvText = `${cand.name}\n${cand.title}\nLocation: ${cand.location}\nSalary: ${cand.salary}\nExperience: ${cand.experience}\n\nSummary:\n${cand.summary}\n\nSkills:\n${cand.skills.join(', ')}\n\nCore Strengths:\n${cand.strengths.join('\n')}\n\nGrowth Areas:\n${cand.risks.join('\n')}`;
                
                const blob = new Blob([cvText], { type: 'text/plain;charset=utf-8' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `CV_${cand.name.replace(/\s+/g, '_')}.txt`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
                
                showToast(`CV for ${cand.name} downloaded successfully!`, 'success');
            });

            document.getElementById('shareProfileBtn').addEventListener('click', () => {
                const cand = getSelectedCandidate();
                if (!cand) return;
                navigator.clipboard.writeText(window.location.href);
                showToast(`Profile link for ${cand.name} copied to clipboard!`, 'success');
            });

            document.getElementById('reportProfileBtn').addEventListener('click', () => {
                const cand = getSelectedCandidate();
                if (!cand) return;
                showToast(`Candidate profile for ${cand.name} reported successfully.`, 'info');
            });
        });

        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.97)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
